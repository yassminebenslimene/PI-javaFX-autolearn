  <rect x='243' y='80' width='12' height='80' fill='#1A4A80'/>
  <!-- Back legs (smaller, perspective) -->
  <rect x='65' y='50' width='8' height='60' fill='#153E6E'/>
  <rect x='227' y='50' width='8' height='60' fill='#153E6E'/>
  <!-- Chairs left front -->
