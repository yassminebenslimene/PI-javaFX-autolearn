  <!-- Chair right front -->
  <rect x='260' y='100' width='35' height='5' fill='#6B3A1F' stroke='#3D1F08' stroke-width='1'/>
  <rect x='263' y='105' width='8' height='40' fill='#6B3A1F'/>
  <rect x='279' y='105' width='8' height='40' fill='#6B3A1F'/>
  <rect x='260' y='75' width='35' height='25' fill='#3D1F08' stroke='#2A1005' stroke-width='1'/>
