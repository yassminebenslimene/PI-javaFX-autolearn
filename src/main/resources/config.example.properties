# ============================================================
# AutoLearn Configuration - COPY THIS FILE TO config.properties
# and fill in your own keys. NEVER commit config.properties!
# ============================================================

# GitHub API Token (optional - for GitHub Examples feature)
# Get yours at: https://github.com/settings/tokens
# Required scope: public_repo
github.api.token=YOUR_GITHUB_TOKEN_HERE

# Groq API Key (required - for AI features: generation, translation, chatbot)
# Get yours FREE at: https://console.groq.com/keys
groq.api.key=YOUR_GROQ_API_KEY_HERE
groq.model=llama-3.3-70b-versatile

# Face Recognition Server (optional)
face.recognition.server=http://localhost:5000
